[package]
name = "neurospace-lab"
version = "1.6.0"
edition = "2021"
authors = ["Bryan P. White <bryan@crvscience.com>"]
description = "Interactive 3D Neural Network Topology, Plasticity & Cerebral Cortex Wetware Lab in Safe Rust"
license = "GPL-3.0-or-later"
readme = "README.md"
homepage = "https://crvscience.com/apps"
repository = "https://github.com/bpwhite/crvscience-neurospace-lab"

[dependencies]
eframe = { version = "0.31", default-features = true, features = ["wgpu"] }
egui = "0.31"
glam = { version = "0.29", features = ["serde"] }
png = "0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
